[package]
name = "velo-viz"
description = "Per-process loopback capture of Spotify.exe + FFT bands for the decorative visualizer."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
velo-domain = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rustfft = { workspace = true }

[target."cfg(windows)".dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_Performance"] }
windows-core = "0.62"

[dev-dependencies]
tracing-subscriber = { workspace = true }
