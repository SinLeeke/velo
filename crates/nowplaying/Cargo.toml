[package]
name = "velo-nowplaying"
description = "Windows SMTC watcher for the Spotify media session."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
velo-domain = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target."cfg(windows)".dependencies]
windows = { workspace = true, features = ["Media", "Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_WinRT", "Win32_System_Com", "Win32_System_Console"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }
