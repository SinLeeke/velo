[package]
name = "velo-spotify"
description = "Spotify Web API provider (official API, remote control only)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
velo-domain = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
keyring = { workspace = true, features = ["windows-native-keyring-store"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
webbrowser = "1"

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true, features = ["test-util"] }
